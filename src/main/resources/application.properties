# ─────────────────────────────────────────────────────────────
#  Salud360 – Solución de Integración
#  application.properties
# ─────────────────────────────────────────────────────────────

server.port=8080
spring.application.name=salud360-integracion

# ── RabbitMQ ──────────────────────────────────────────────────
# Credenciales idénticas al proyecto de referencia taller-semana-7-rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ── Apache Camel ──────────────────────────────────────────────
camel.springboot.name=Salud360CamelContext
# No finalizar automáticamente (la app debe correr indefinidamente)
camel.springboot.main-run-controller=true

# ── Nombres de exchanges y colas (referencia en el código) ────
# RF2 — Point-to-Point
salud360.rabbitmq.billing.queue=billing.queue
# RF3 — Publish/Subscribe
salud360.rabbitmq.events.exchange=appointments.events
salud360.rabbitmq.notifications.queue=notifications.queue
salud360.rabbitmq.analytics.queue=analytics.queue

# ── Rutas de archivos (relativas al directorio raíz del proyecto) ──
salud360.data.outbox=data/outbox
salud360.data.errors=data/errors
salud360.data.auditoria.filename=auditoria-citas.csv
salud360.data.errores.filename=citas-rechazadas.log

# ── SpringDoc / Swagger UI ────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ── Logging ───────────────────────────────────────────────────
logging.level.edu.udla.integracion=DEBUG
logging.level.org.apache.camel=INFO
logging.level.org.springframework.amqp=INFO
